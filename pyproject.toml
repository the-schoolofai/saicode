[build-system]
# 1.27+ writes Core Metadata 2.4 (SPDX license expression, License-File).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "saicode"
dynamic = ["version"]
description = "A terminal coding agent: small core, safe by default, enterprise-ready foundations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SAI Code Team" }]
maintainers = [{ name = "Muhammad Rizwan" }]
keywords = ["ai", "agent", "coding-agent", "cli", "terminal", "llm", "gemini", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Ranges are capped at the next major version. For production builds,
# install from the lock file (uv.lock) so every version is pinned exactly.
dependencies = [
    "google-genai>=1.50,<4",
    "rich>=13.7,<15",
    "prompt_toolkit>=3.0.40,<4",
    "keyring>=25,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.17",
    "mypy>=2.4",
]

[project.scripts]
saicode = "saicode.cli.main:main"

[project.urls]
Homepage = "https://github.com/the-schoolofai/saicode"
Repository = "https://github.com/the-schoolofai/saicode"
Issues = "https://github.com/the-schoolofai/saicode/issues"
Changelog = "https://github.com/the-schoolofai/saicode/blob/main/CHANGELOG.md"
Security = "https://github.com/the-schoolofai/saicode/security/policy"

[tool.hatch.version]
path = "src/saicode/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/saicode"]

[tool.hatch.build.targets.sdist]
include = [
    "src/saicode",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]

# "›" and "·" are deliberate characters in the terminal UI.
allowed-confusables = ["›", "·"]

[tool.ruff.lint.isort]
known-first-party = ["saicode"]

[tool.mypy]
python_version = "3.11"
files = ["src/saicode"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_reexport = true
